<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zino Francescatti — Discography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
  <div class="eyebrow">Discography</div>
  <h1>Zino Francescatti</h1>
  <div class="sub">1922–1975 &middot; 420 recordings</div>
  <a class="back-link" href="../index.html">&larr; All performers</a>
</header>

<div class="toolbar">
  <div class="field">
    <label for="f-composer">Composer</label>
    <select id="f-composer"><option value="">All</option></select>
  </div>
  <div class="field">
    <label for="f-label">Label</label>
    <select id="f-label"><option value="">All</option></select>
  </div>
  <div class="field">
    <label for="f-live">Type</label>
    <select id="f-live">
      <option value="">All</option>
      <option value="live">Live</option>
      <option value="studio">Studio</option>
    </select>
  </div>
  <div class="field">
    <label for="f-sort">Sort by</label>
    <select id="f-sort">
      <option value="composer">Composer / work</option>
      <option value="count">Most recorded works first</option>
    </select>
  </div>
  <div class="field">
    <label for="f-search">Search (work, performers, notes)</label>
    <input type="text" id="f-search" placeholder="e.g. Elgar, Barenboim">
  </div>
  <div class="count" id="count"></div>
</div>

<div class="list" id="list"></div>

<script>
  window.DISCOGRAPHY_CONFIG = { dataUrl: '../data/francescatti.json' };
</script>
<script src="../assets/discography.js"></script>

</body>
</html>
