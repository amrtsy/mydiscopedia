name: Rebuild discography site

on:
  workflow_dispatch:        # manual "Run workflow" button
  schedule:
    - cron: "0 18 * * *"    # once a day at 18:00 UTC (03:00 JST) — adjust as you like

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build data (from published Google Sheet CSV)
        run: |
          python3 scripts/build.py --csv-base "${{ vars.SHEET_CSV_BASE }}"

      - name: Generate HTML pages
        run: |
          python3 scripts/generate_html.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Auto-rebuild from spreadsheet ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
